[project]
name = "skill-engine"
version = "0.1.0"
description = "独立的 skills 解析和路由工具，兼容 Claude Code Agent Skills 开放标准"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "gradio>=6.20.0",
    "jieba>=0.42.1",
    "prompt-toolkit>=3.0",
    "tavily-python>=0.5.0",
    "pyfiglet>=1.0",
    "websocket-client>=1.8.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
llm = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
ui = [
    "gradio>=6.0",
]
tokenize = [
    "jieba>=0.42",
]

[project.scripts]
skill-engine = "skill_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_engine"]
# 把仓库根的 skills/ 一并打进 wheel 的 skill_engine/skills/，
# 使 uv tool 全局命令也能用引擎内置 skills（开发态与安装态统一通过
# importlib.resources 定位，见 routing/discovery.py:_builtin_skills_dir）。
# hatchling 默认排除 __pycache__/*.pyc（且 .gitignore 已忽略），不会带入缓存。
[tool.hatch.build.targets.wheel.force-include]
"skills" = "skill_engine/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-p", "no:capture"]

[tool.ruff]
target-version = "py312"
line-length = 120
