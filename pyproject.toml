[project]
name = "skill-engine"
version = "0.1.0"
description = "独立的 skills 解析和路由工具，兼容 Claude Code Agent Skills 开放标准"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "gradio>=6.20.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
langchain = [
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=1.3.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "asyncio>=4.0.0",
]
llm = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
ui = [
    "gradio>=6.0",
]
tokenize = [
    "jieba>=0.42",
]

[project.scripts]
skill-engine = "skill_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
